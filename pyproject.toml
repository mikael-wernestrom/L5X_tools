[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l5x-tools"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1", "pyyaml>=6.0", "openpyxl>=3.1", "xlrd>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "tools*", "scripts*"]

[project.scripts]
l5x-gen = "tools.l5x_gen.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
